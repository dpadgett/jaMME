<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenJK WebAssembly Multiplayer Demo Player</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-panel: #161b22;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #jk-player-pane {
      position: relative;
      flex: 1 1 auto;
      min-height: 200px;
      width: 100%;
      margin: 0;
      background: #000;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    #jk-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      background: #000;
      outline: none;
    }
    #jk-controls-bar {
      flex: 0 0 auto;
      width: 100%;
      margin: 0;
      padding: 10px 16px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    button, select, input[type="text"] {
      background-color: #21262d;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent-hover);
    }
    input[type="text"] {
      cursor: text;
      min-width: 180px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    #status-bar {
      margin-left: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>OpenJK WebAssembly Demo Player (Jedi Academy MP)</h1>
    <div class="control-group">
      <label for="host-input">Notes / Search:</label>
      <input id="host-input" type="text" placeholder="Type here without game capture..." />
    </div>
  </header>

  <main>
    <div id="jk-player-pane">
      <canvas id="jk-canvas" width="640" height="360" tabindex="-1"></canvas>
    </div>

    <div id="jk-controls-bar">
      <div class="control-group">
        <button id="btn-play-pause" type="button">Pause</button>
        <button id="btn-start-over" type="button" title="Restart from 0:00">⏮ 0:00</button>
      </div>

      <div class="control-group" style="flex: 1 1 200px; min-width: 180px;">
        <input id="slider-seek" type="range" min="0" max="1000" step="50" value="0" style="flex: 1 1 auto;" />
        <span id="time-display" style="font-family: ui-monospace, monospace; font-size: 12px; min-width: 85px;">00:00 / 00:00</span>
      </div>

      <div class="control-group">
        <button id="btn-loop" type="button" aria-pressed="true">Loop: On</button>
      </div>

      <div class="control-group">
        <label for="select-speed">Speed:</label>
        <select id="select-speed">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1" selected>1.0x</option>
          <option value="2">2.0x</option>
          <option value="4">4.0x</option>
        </select>
      </div>

      <div class="control-group">
        <button id="btn-mute" type="button">Mute</button>
        <label for="slider-volume">Vol:</label>
        <input id="slider-volume" type="range" min="0" max="1" step="0.05" value="0.8" />
      </div>

      <div class="control-group">
        <label for="select-demo">Demo:</label>
        <select id="select-demo">
          <option value="1.51ef9.dm_26">1.51ef9.dm_26 (ctf_kejim)</option>
          <option value="out.dm_26">out.dm_26 (mp/ctf1)</option>
          <option value="hood.dm_26">hood.dm_26 (mp/ffa3)</option>
          <option value="kom.dm_26">kom.dm_26 (mp/ctf2)</option>
          <option value="redstar.dm_26">redstar.dm_26 (mp/ctf4)</option>
        </select>
        <button id="btn-load-demo" type="button">Load Demo</button>
      </div>

      <div class="control-group">
        <button id="btn-renderer" type="button" title="Toggle between Hardware GPU WebGL and Software Rendering">Renderer: Auto</button>
      </div>

      <div id="status-bar">Initializing OpenJK Wasm...</div>
    </div>
  </main>

  <script src="/player.js"></script>
</body>
</html>
